  <!-- 右侧：文字 -->
  <g transform="translate(360,78)" fill="#fff">
    <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="30" font-weight="700">学生名单 · 多视图渲染</text>
    <text x="0" y="34" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" opacity="0.88">条件渲染练习 · 表格 / 卡片 / 名单三种显示方式</text>
    <text x="0" y="62" font-family="ui-monospace, Consolas, monospace" font-size="13" opacity="0.75">v-if / v-else-if / v-else  +  Element Plus</text>
  </g>

  <!-- 统计数据迷你图 -->
  <g transform="translate(620,86)" fill="#fff">
    <rect x="0" y="46" width="14" height="26" rx="3" opacity="0.55"/>
    <rect x="22" y="30" width="14" height="42" rx="3" opacity="0.7"/>
    <rect x="44" y="14" width="14" height="58" rx="3" opacity="0.85"/>
